server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# The UI is a single-page app: every path that is not a file on disk has to be answered
	# with the shell, or a reload of /buckets/name is a 404.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Hashed assets are immutable; the shell and the runtime config never are, or a deployment
	# would keep serving the previous API URL out of the browser cache.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location = /config.json {
		add_header Cache-Control "no-cache";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
}
