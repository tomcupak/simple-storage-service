name: Release

# Images are built from a tag, not from every push: a tag is the only thing that says "this
# commit is meant to be deployed". The three targets come out of one Dockerfile and one build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        target: [api, s3, web]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The three targets share the `build` stage, so they also share its cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The standalone image is built and published separately from the three composable ones: it has
  # its own registry (Docker Hub, where someone looking for "an S3 server in a container" looks
  # first) and its own documentation, which is the repository page itself.
  standalone:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is where this image is published, so a missing credential is an error rather
      # than a reason to quietly ship to ghcr alone - a release that silently went nowhere is
      # worse than one that failed. `secrets` cannot be read from an `if:` expression, only from
      # `run`/`with`, hence the detour through an output.
      - id: hub
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'tomcupak/storage' }}
          USERNAME_SET: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$USERNAME_SET" != 'true' ] || [ "$TOKEN_SET" != 'true' ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set as repository secrets (Settings > Secrets and variables > Actions). Without them nothing reaches ${REPOSITORY}."
            exit 1
          fi
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/standalone
            docker.io/${{ steps.hub.outputs.repository }}
          # A stable tag (v1.2.0) gets 1.2.0, 1.2, sha-... and latest; `latest` comes from the
          # `flavor` default (`latest=auto`), which knows to skip a prerelease. A prerelease tag
          # (v1.2.0-beta.1) gets only 1.2.0-beta.1 and sha-...: semver patterns collapse to the
          # full version for a prerelease, so a beta can never move 1.2 or latest.
          #
          # `beta` on top of that is a channel pointer - "the newest prerelease" - for someone who
          # wants to follow them without reading the tag list. `is_default_branch` is deliberately
          # not used anywhere here: it is false on a tag push, so a rule guarded by it never fires.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: standalone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only: the image would build for arm64, but under QEMU the webpack build and two
          # npm installs take long enough that it belongs behind a deliberate choice rather than
          # in every release. Add linux/arm64 here when someone needs it.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Says where the release actually went, on the run's own summary page - the question a
      # finished job otherwise leaves open.
      - env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published'
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Docker Hub page is documentation like any other, so it lives in the repository and is
      # published from it - a description edited in the web UI would be overwritten by the next
      # release, which is the point.
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.hub.outputs.repository }}
          short-description: 'S3-compatible object storage with a management UI, in one container'
          readme-filepath: docker/standalone/DOCKERHUB.md
